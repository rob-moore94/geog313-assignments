[workspace]
channels = ["conda-forge"]
name = "assignment-5"
platforms = ["osx-arm64", "osx-64", "linux-64"]
version = "0.1.0"

[activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT"

[tasks]
test = "pytest"

[dependencies]
pystac-client = ">=0.9.0,<0.10"
rioxarray = ">=0.23.0,<0.24"
rasterio = ">=1.5.2,<2"
matplotlib = ">=3.11.2,<4"
python = ">=3.14.7,<3.15"
jupyterlab = ">=4.6.4,<5"
pyproj = ">=3.8.0,<4"
shapely = ">=2.1.2,<3"
cartopy = ">=0.26.0,<0.27"
libgdal-jp2openjpeg = ">=3.13.3,<4"
pytest = ">=9.1.1,<10"
